[project]
name = "scientific_rag_for_equations"
version = "0.1.0"
description = "Equation-aware retrieval, citation grounding, and structured tools for technical research resources."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
